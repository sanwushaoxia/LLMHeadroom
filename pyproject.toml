[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headroom"
version = "0.2.0"
description = "Headroom — 通用上下文压缩层:专用压缩器 + ContentRouter 自动路由 + CCR 按需取回"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[project.scripts]
headroom = "headroom.cli:main"

[tool.setuptools.packages.find]
include = ["headroom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
